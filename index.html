<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mavrični svet - Varni klepet</>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fcf6bd;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            color: #d4a373;
        }
        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 650px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mavrični svet</h1>
        <p>Miren, varen in prijeten kotiček za klepet. Tukaj velja spoštovanje!</p>
    </header>

    <div class="chat-container">
        <!-- Vgrajen spletni klepet za tvoj kanal -->
        <iframe src="https://web.libera.chat/?channels=#MavricniSvet"></iframe>
    </div>

</body>
</html>
